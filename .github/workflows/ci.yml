name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax & Shell Checks
        run: |
          npm run lint
          bash -n install.sh scripts/*.sh android/bt-battery-helper/build.sh
      - name: Run Unit Tests
        run: npm test
      - name: Check Android Helper Java Sources
        run: find android/bt-battery-helper/src -name '*.java' -print
